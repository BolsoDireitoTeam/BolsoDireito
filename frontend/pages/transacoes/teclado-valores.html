<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolso Direito - Teclado de Valores</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/styles/style.css">
    <script type="module" src="../../static/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="app-body calc-body" data-page="teclado-valores">

    <div class="calc-shell">
        <header class="app-header-back mb-3">
            <!-- Aqui temos a construção de um botão que serve para acessar o histório prévio antes de acessarmos esta respectiva página -->
            <button class="back-btn" id="btn-voltar" data-action="back" aria-label="Voltar">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h2 id="tituloTeclado">Digitar Valor</h2>
        </header>

        <!-- Campo de nome do Ganho (visivel apenas quando tipo=ganho) -->
        <div id="campoNomeGanho" class="nome-input-wrapper" style="display:none;">
            <label for="inputNomeGanho">Descrição (opcional)</label>
            <input type="text" id="inputNomeGanho" placeholder="Ex: Salário, Freelance..." autocomplete="off">
        </div>

        <div class="calc-display">
            <div class="calc-equation" id="visorEquacao"></div>
            <div class="calc-result" id="visorResultado">R$ 0,00</div>
        </div>

        <div class="calc-keypad">

            <!-- Aqui temos a construção de todos os botões existentes dentro da calculadora que estamos exibindo em nosso sistema -->
            <button class="calc-btn" data-calc="inserir" data-val="1">1</button>
            <button class="calc-btn" data-calc="inserir" data-val="2">2</button>
            <button class="calc-btn" data-calc="inserir" data-val="3">3</button>
            <button class="calc-btn op-btn" id="btn-apagar" data-calc="apagar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                    <line x1="18" y1="9" x2="12" y2="15"></line>
                    <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
            <button class="calc-btn" data-calc="inserir" data-val="4">4</button>
            <button class="calc-btn" data-calc="inserir" data-val="5">5</button>
            <button class="calc-btn" data-calc="inserir" data-val="6">6</button>
            <button class="calc-btn op-btn" data-calc="inserir" data-val="+">+</button>
            <button class="calc-btn" data-calc="inserir" data-val="7">7</button>
            <button class="calc-btn" data-calc="inserir" data-val="8">8</button>
            <button class="calc-btn" data-calc="inserir" data-val="9">9</button>
            <button class="calc-btn op-btn" data-calc="inserir" data-val="-">−</button>
            <button class="calc-btn" data-calc="inserir" data-val=","><span style="font-size:1.2rem">,</span></button>
            <button class="calc-btn" data-calc="inserir" data-val="0">0</button>
            <button class="calc-btn op-btn" id="btn-igual" data-calc="calcular">=</button>
            <button class="calc-btn op-btn" id="btn-limpar" data-calc="limpar">C</button>

        </div>

        <button class="bd-btn-primary confirm-value-btn" id="btn-confirmar">
            Confirmar Valor
        </button>
    </div>



</body>

</html>
